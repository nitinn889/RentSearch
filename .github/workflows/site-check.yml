name: Site check

# Reads each property site once from a cloud machine, like a hosted Rent Radar would.
# A failure here means a site changed its pages or blocks cloud servers.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"        # Mondays 09:00 IST
  push:
    branches: [main]
    paths: ["radar/sources/**", "radar/http.py", "radar/schema_org.py", "scripts/site_check.py"]

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/site_check.py
